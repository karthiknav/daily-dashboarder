[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily_dashboard"
version = "0.1.0"
description = "Agentic daily scan of Azure DevOps pipelines for dependency/Checkmarx findings, with automated branch+PR remediation."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
daily-dashboard = "daily_dashboard:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_dashboard = ["resources/**/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
