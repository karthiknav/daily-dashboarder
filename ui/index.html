  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="topbar">
    <button class="mobile-menu icon-button" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" data-icon="menu"></button>
    <a class="brand" href="#operations-wall" aria-label="Operations Wall home">
      <img src="assets/favicon.svg" width="42" height="42" alt="">
      <span><h1>Operations Wall</h1><span class="subtitle">Local JSON data</span></span>
    </a>
    <select id="team-select" aria-label="Team"><option>All Teams</option></select>
    <div class="header-actions">
      <time id="snapshot-time"></time>
      <button class="icon-button" id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen" data-icon="monitor"></button>
      <button class="icon-button" id="refresh" aria-label="Reload dashboard data" title="Reload embedded chart data" data-icon="refresh"></button>
      <button class="icon-button" data-action="choose-backend-json" aria-label="Load backend report JSON" title="Load backend report JSON" data-icon="report"></button>
      <button class="icon-button" data-action="settings" aria-label="Settings" title="Settings" data-icon="settings"></button>
      <button class="icon-button" data-action="scanner" aria-label="Open RaboBank Dependency Scanner" title="RaboBank Dependency Scanner" data-icon="scan"></button>
      <button class="icon-button notification" data-action="alerts" aria-label="View alerts" title="Alerts"><span data-icon="bell"></span><span id="notification-count" class="badge"></span></button>
      <div class="profile"><span class="avatar" aria-hidden="true">AI<span class="online-dot"></span></span><span><strong id="user-name"></strong><small id="user-role"></small></span></div>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <nav id="side-nav" aria-label="Main navigation"></nav>
      <div class="assistant-box">
        <div class="assistant-status"><span class="bot-icon" data-icon="bot"></span><div><span id="assistant-name"></span><small><span class="online-dot"></span> <span id="assistant-status"></span></small></div></div>
        <button class="copilot-button" data-action="copilot"><span data-icon="sparkles"></span> <span id="assistant-button-label"></span></button>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <div id="scanner-error" class="error-banner" role="alert" hidden></div>
      <input id="scanner-file" type="file" accept=".json,application/json" hidden>
      <input id="backend-report-file" type="file" accept=".json,application/json" hidden>
      <div id="loading" role="status" hidden>Loading data…</div>
      <section id="kpis" class="kpi-grid" aria-label="Engineering summary"></section>
      <div class="charts-grid" id="chart-grid">
        <section class="panel pipeline-panel" id="pipeline" aria-labelledby="pipeline-title"><div class="panel-heading"><h2 id="pipeline-title"></h2><button class="text-link" data-detail="pipeline"></button></div><div id="pipeline-content" class="pipeline-content"></div></section>
        <section class="panel incidents-panel" id="incidents" aria-labelledby="incidents-title"><div class="panel-heading"><h2 id="incidents-title"></h2></div><div id="incidents-content" class="chart-and-legend"></div></section>
        <section class="panel environment-panel" id="environments" aria-labelledby="environment-title"><div class="panel-heading"><h2 id="environment-title"></h2></div><div id="environment-content" class="table-wrap"></div><button class="text-link panel-footer" data-detail="environments"></button></section>
        <section class="panel vulnerability-panel" id="vulnerabilities" aria-labelledby="vulnerability-title"><div class="panel-heading"><h2 id="vulnerability-title"></h2></div><div id="vulnerability-content" class="vulnerability-content"></div><button class="text-link panel-footer" data-detail="vulnerabilities"></button></section>
        <section class="panel top-vulnerability-panel" id="top-vulnerabilities" aria-labelledby="top-vulnerability-title"><div class="panel-heading"><h2 id="top-vulnerability-title"></h2><small id="severity-heading"></small></div><div id="top-vulnerability-content" class="table-wrap"></div><button class="text-link panel-footer" data-detail="vulnerabilities"></button></section>
        <section class="panel certificate-panel" id="certificates" aria-labelledby="certificate-title"><div class="panel-heading"><h2 id="certificate-title"></h2></div><div id="certificate-content" class="table-wrap"></div><button class="text-link panel-footer" data-detail="certificates"></button></section>
        <section class="panel dependency-report-panel" id="dependency-scanner" aria-labelledby="dependency-scanner-title"><div class="panel-heading"><h2 id="dependency-scanner-title">Dependency Scanner Findings</h2><button class="text-link" data-action="choose-backend-json">Load JSON</button></div><div id="dependency-scanner-content" class="table-wrap"></div></section>
        <section class="panel checkmarx-report-panel" id="checkmarx" aria-labelledby="checkmarx-title"><div class="panel-heading"><h2 id="checkmarx-title">Checkmarx Findings</h2><button class="text-link" data-action="choose-backend-json">Load JSON</button></div><div id="checkmarx-content" class="table-wrap"></div></section>
        <section class="panel pipeline-findings-panel" id="pipeline-findings" aria-labelledby="pipeline-findings-title"><div class="panel-heading"><h2 id="pipeline-findings-title">Pipeline Findings</h2><button class="text-link" data-action="choose-backend-json">Refresh source</button></div><div id="pipeline-findings-content" class="table-wrap"></div></section>
      </div>
    </main>
  </div>
  <footer class="bottom-bar"><span id="integration-caption"></span><nav id="integrations" aria-label="Integrated tools"></nav><button class="auto-refresh" data-action="choose-backend-json"><span class="online-dot"></span> Backend Report JSON</button></footer>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Close dialog" data-icon="close"></button></div><div id="dialog-body"></div></dialog>
